name: Expo mobile CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx --no-install tsc --noEmit

      - name: Biome Check
        run: npm run check

      - name: Expo Doctor
        run: npx --no-install expo-doctor

      - name: Build Check
        run: npx expo export --platform all
